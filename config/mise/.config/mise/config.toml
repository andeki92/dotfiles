# mise configuration
# See: https://mise.jdx.dev/configuration.html

[tools]
adr-tools = "3.0.0"
age = "1.3.2"
"aqua:bats-core/bats-core" = "1.14.0"
bat = "0.26.1"
bottom = "0.15.0"
# Lets `cargo:` tools install from their publishers' prebuilt binaries
# instead of compiling (`cargo.binstall` is on by default but needs this on
# PATH). mise turns binstall's cargo-quickinstall fallback off, so it never
# reaches for a third-party rebuild.
cargo-binstall = "1.27.0"
fd = "10.5.2"
fzf = "0.75.0"
gh = "2.104.0"
"github:cilium/cilium-cli" = "0.20.3"
gitleaks = "8.30.1"
go = "1.27.4"
gradle = "9.9.1"
helm = "4.3.2"
java = "25" # Locked on LTS
jq = "1.8.2"
kubectl = "1.37.2"
kubectx = "0.11.0"
kubens = "0.11.0"
lazygit = "0.66.3"
lefthook = "2.2.2"
"npm:markdownlint-cli2" = "0.24.1"
opentofu = "1.13.9"
"pypi:yamllint" = "1.38.0"
python = "3.15.2"
ripgrep = "15.2.0"
rust = "1.100.0"
shellcheck = "0.11.0"
sops = "3.13.3"
starship = "1.27.0"
talosctl = "1.14.6"
task = "3.54.0"
uv = "0.13.8"
yq = "4.54.3"
node = "latest"
"aqua:ast-grep/ast-grep" = "0.51.2"
"aqua:rust-lang/rust-analyzer" = "2026-11-09"

[settings]
experimental = true
# Supply-chain cooldown: a fuzzy version (`latest`, `3`, `stable`) resolves
# only to a release at least a week old, matching Renovate's
# minimumReleaseAge. Exact pins are never filtered.
minimum_release_age = "7d"
lockfile_platforms = ["linux-arm64", "macos-arm64"]
not_found_auto_install = false

# Install `pypi:` backend tools (e.g. yamllint) with uv's `uv tool` instead of
# pipx — no pipx dependency, much faster. Requires the `uv` tool above.
[settings.pypi]
uvx = true
