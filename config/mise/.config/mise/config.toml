# mise configuration
# See: https://mise.jdx.dev/configuration.html

[tools]
adr-tools = "3.0.0"
age = "1.3.1"
"aqua:bats-core/bats-core" = "1.14.0"
bat = "0.26.1"
bottom = "0.14.7"
"cargo:tree-sitter-cli" = "0.26.11"
fd = "10.4.2"
fzf = "0.74.2"
gh = "2.97.0"
"github:cilium/cilium-cli" = "0.19.7"
"github:luarocks/luarocks" = { version = "3.12.2", os = ["macos"] }
gitleaks = "8.30.1"
go = "1.26.5"
gradle = "9.6.1"
helm = "4.2.3"
java = "25" # Locked on LTS
jq = "1.8.2"
kubectl = "1.36.3"
kubectx = "0.11.0"
kubens = "0.11.0"
lazygit = "0.64.0"
lefthook = "2.1.10"
lua = "5.1.5" # MUST be 5.1.x for lazyvim
neovim = "0.12.4"
"npm:markdownlint-cli2" = "0.23.2"
opentofu = "1.12.5"
"pipx:yamllint" = "1.38.0"
python = "3.14.6"
ripgrep = "15.2.0"
rust = "1.97.1"
shellcheck = "0.11.0"
sops = "3.13.3"
starship = "1.26.0"
talosctl = "1.13.7"
task = "3.52.0"
uv = "0.12.1"
yq = "4.53.3"
node = "latest"

[settings]
experimental = true

# Install `pipx:` backend tools (e.g. yamllint) with uv's `uv tool` instead of
# pipx — no pipx dependency, much faster. Requires the `uv` tool above.
[settings.pipx]
uvx = true
