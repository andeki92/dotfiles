id = "dotfiles.gh-alerts"
name = "GitHub Alerts"
version = "0.1.0"
min_herdr_version = "0.7.0"
platforms = ["linux", "macos"]

[[panes]]
id = "needs-me"
title = "Needs me"
command = ["bash", "needs-me-launch.sh"]

[[panes]]
id = "opened-by-me"
title = "Opened by me"
command = ["bash", "opened-by-me-launch.sh"]

[[panes]]
id = "renovate"
title = "Renovate"
command = ["bash", "renovate-launch.sh"]

[[actions]]
id = "open-needs-me"
title = "Open: Needs me"
contexts = ["workspace"]
command = ["bash", "open-in-github-workspace.sh", "needs-me"]

[[actions]]
id = "open-opened-by-me"
title = "Open: Opened by me"
contexts = ["workspace"]
command = ["bash", "open-in-github-workspace.sh", "opened-by-me"]

[[actions]]
id = "open-renovate"
title = "Open: Renovate"
contexts = ["workspace"]
command = ["bash", "open-in-github-workspace.sh", "renovate"]
