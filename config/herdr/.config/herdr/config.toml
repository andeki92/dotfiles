onboarding = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"

# `$pr` is the branch's PR / MR and CI rollup, reported by the pr-status
# plugin. Claude rows trade the tab label for Claude's own live session title,
# which follows what the session is doing rather than how it started.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent", "$pr"],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "machine", "workspace", "$pr"],
  ["terminal_title_stripped"],
]

[experimental]
switch_ascii_input_source_in_prefix = false

[keys]
prefix = "ctrl+a"
reload_config = "prefix+shift+r"
